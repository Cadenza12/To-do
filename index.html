<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>每日任务</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="top-bar">
        <div>
          <p class="eyebrow" id="weekdayLabel">今天</p>
          <h1>每日任务</h1>
        </div>
        <button class="icon-button" id="refreshDayButton" type="button" aria-label="刷新今天的列表">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 15.7-6.1L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-15.7 6.1L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </button>
      </header>

      <section class="status-panel" aria-label="今日进度">
        <div class="progress-ring" aria-hidden="true">
          <span id="percentLabel">0%</span>
        </div>
        <div class="status-copy">
          <p id="dateLabel"></p>
          <strong id="progressLabel">还没有完成任务</strong>
        </div>
      </section>

      <section class="task-section" aria-label="任务列表">
        <div class="section-head">
          <h2>清单</h2>
          <button class="text-button" id="clearDoneButton" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>清空勾选</span>
          </button>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <p class="empty-state" id="emptyState">还没有任务，先添加一件小事。</p>
      </section>

      <form class="composer" id="addTaskForm">
        <label class="sr-only" for="newTaskInput">新任务</label>
        <input id="newTaskInput" name="task" type="text" autocomplete="off" placeholder="添加今天要做的事" />
        <button class="add-button" type="submit" aria-label="添加任务">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
      </form>
    </main>

    <template id="taskTemplate">
      <li class="task-item">
        <button class="check-button" type="button" aria-label="标记完成">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
        <textarea class="task-input" rows="1"></textarea>
        <button class="delete-button" type="button" aria-label="删除任务">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 6h18" />
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
        </button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
